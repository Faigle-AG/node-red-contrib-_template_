<script type="text/javascript">
    RED.nodes.registerType('_template_', {
        category: 'function',
        color: '#E6EE9C',
        defaults: {
            name: { value: '' },
            enableLogging: { value: false },
            source: {
                value: 'payload',
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    var validator = RED.validators.typedInput('sourceType');
                    return validator.call(this, v);
                },
            },
            sourceType: { value: 'msg' },
            target: {
                value: 'payload',
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    var validator = RED.validators.typedInput('targetType');
                    return validator.call(this, v);
                },
            },
            targetType: { value: 'msg' },
            // Legacy properties for backwards compatibility
            exampleIn: { value: '' },
            exampleInType: { value: 'str' },
            exampleOut: { value: '' },
            exampleOutType: { value: 'msg' },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-cog',
        paletteLabel: '_template_',
        label: function () {
            return this.name || (this.source ? '_template_ (' + this.source + ')' : '_template_');
        },
        oneditprepare: function () {
            // Migrate legacy properties if present
            if ((!this.source || this.source === 'payload') && this.exampleIn) {
                this.source = this.exampleIn;
                this.sourceType = this.exampleInType || 'str';
                $('#node-input-source').val(this.source);
            }
            if ((!this.target || this.target === 'payload') && this.exampleOut) {
                this.target = this.exampleOut;
                this.targetType = this.exampleOutType || 'msg';
                $('#node-input-target').val(this.target);
            }

            $('#node-input-source').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global', 'str', 'num', 'bool', 'json', 'jsonata', 'env'],
                typeField: $('#node-input-sourceType'),
            });

            $('#node-input-target').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-targetType'),
            });
        },
        oneditsave: function () {
            // Synchronize legacy fields
            $('#node-input-exampleIn').val($('#node-input-source').val());
            $('#node-input-exampleInType').val($('#node-input-sourceType').val());
            $('#node-input-exampleOut').val($('#node-input-target').val());
            $('#node-input-exampleOutType').val($('#node-input-targetType').val());
        },
    });
</script>

<link rel="stylesheet" href="resources/@faigle/node-red-runtime-utils/editor.css" />

<script type="text/html" data-template-name="_template_">
    <div class="faigle-node-editor">
        <div class="form-row">
            <label for="node-input-name">
                <i class="fa fa-tag"></i>
                <span>Name</span>
            </label>
            <input type="text" id="node-input-name" placeholder="Name" />
        </div>

        <fieldset class="node-red-fieldset">
            <legend>Configuration</legend>

            <div class="form-row flex-checkbox-row">
                <input type="checkbox" id="node-input-enableLogging" />
                <label for="node-input-enableLogging">Enable Logging</label>
            </div>

            <div class="form-row">
                <label for="node-input-source">
                    <i class="fa fa-sign-in"></i>
                    <span>Source</span>
                </label>
                <input type="text" id="node-input-source" placeholder="Source property" />
                <input type="hidden" id="node-input-sourceType" />
            </div>

            <div class="form-row">
                <label for="node-input-target">
                    <i class="fa fa-sign-out"></i>
                    <span>Target</span>
                </label>
                <input type="text" id="node-input-target" placeholder="Target property" />
                <input type="hidden" id="node-input-targetType" />
            </div>
        </fieldset>

        <!-- Hidden inputs for legacy flow compatibility -->
        <input type="hidden" id="node-input-exampleIn" />
        <input type="hidden" id="node-input-exampleInType" />
        <input type="hidden" id="node-input-exampleOut" />
        <input type="hidden" id="node-input-exampleOutType" />
    </div>
</script>

<script type="text/markdown" data-help-name="_template_">
A boilerplate template node demonstrating standard Faigle Node-RED practices.

### Description

This node illustrates the canonical architecture for custom nodes:
1. Reads input from a configurable **Source** property using `@faigle/node-red-runtime-utils`.
2. Applies sample transformation logic.
3. Writes output to a configurable **Target** property (`msg`, `flow`, or `global`).
4. Manages visual node status (`processing`, `succeeded`, `failed`, `waiting`).

### Properties

- **Name** _string_ \
  The custom label displayed for this node in the workspace.

- **Enable Logging** _boolean_ \
  When checked, outputs informative debug logs to the Node-RED console.

- **Source** _msg | flow | global | str | num | bool | json | jsonata | env_ \
  The property or value evaluated as input for processing. Default is `msg.payload`.

- **Target** _msg | flow | global_ \
  The destination where the transformed result will be stored. Default is `msg.payload`.

### Usage for Developers

To create a new custom node using this repository as a template:
1. Rename all instances of `_template_` to your node name.
2. Define custom properties in the `defaults` section and editor form.
3. Use `node.getTypedProperty()` and `node.setTypedProperty()` for input/output handling.
4. Keep the shared styling from `@faigle/node-red-runtime-utils/editor.css`.
</script>
